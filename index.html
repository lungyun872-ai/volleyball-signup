<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>排球社本週報名系統</title>
  <!-- 引入 Tailwind CSS 快速美化 UI -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white shadow-xl rounded-2xl p-6 w-full max-w-md">
    <!-- 標題與活動資訊 -->
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-indigo-600 mb-1">🏐 排球社本週打球報名</h1>
      <p id="event-date" class="text-gray-500 font-medium">活動日期：2026/09/25 (五) 18:30</p>
    </div>

    <!-- 社員報名表單 -->
    <div id="signup-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">請輸入員工編號</label>
        <div class="flex gap-2">
          <input type="text" id="emp-id" placeholder="例如：E001" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:ring-2 focus:ring-indigo-500 outline-none">
          <button onclick="checkEmployee()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition">查詢</button>
        </div>
      </div>

      <!-- 查詢後自動跳出的姓名與確認資訊 -->
      <div id="member-info" class="hidden p-4 bg-indigo-50 border border-indigo-100 rounded-lg space-y-2">
        <p class="text-sm text-gray-600">社員姓名：<span id="member-name" class="font-bold text-gray-800 text-lg">---</span></p>
        <p class="text-sm text-gray-600">所屬部門：<span id="member-dept" class="font-medium text-gray-700">---</span></p>
        
        <div class="pt-2 flex gap-3">
          <button onclick="submitAttendance('Present')" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-2 rounded-lg font-bold transition shadow">✅ 我要出席</button>
          <button onclick="submitAttendance('Absent')" class="flex-1 bg-gray-300 hover:bg-gray-400 text-gray-700 py-2 rounded-lg font-bold transition">❌ 請假/不出席</button>
        </div>
      </div>

      <!-- 報名成功狀態訊息 -->
      <div id="status-message" class="hidden p-3 rounded-lg text-center font-medium"></div>
    </div>

    <!-- 當週已報名人員名單 -->
    <div class="mt-8 border-t pt-4">
      <h2 class="text-md font-bold text-gray-700 mb-2">📊 目前已報名名單 (<span id="attendee-count">2</span> 人)</h2>
      <ul id="attendee-list" class="space-y-1 text-sm text-gray-600 max-h-40 overflow-y-auto">
        <li class="p-2 bg-gray-50 rounded flex justify-between"><span>E001 張小明</span><span class="text-green-600 font-bold">出席</span></li>
        <li class="p-2 bg-gray-50 rounded flex justify-between"><span>E002 李小華</span><span class="text-green-600 font-bold">出席</span></li>
      </ul>
    </div>
  </div>

  <!-- 前端邏輯 (Mockup 假資料階段) -->
  <script>
    // 假資料庫（模擬未來的 Google Sheet 社員名冊）
    const mockMembers = {
      "E001": { name: "張小明", dept: "資訊部" },
      "E002": { name: "李小華", dept: "行銷部" },
      "E003": { name: "王大明", dept: "設計部" }
    };

    function checkEmployee() {
      const id = document.getElementById("emp-id").value.trim().toUpperCase();
      const infoBox = document.getElementById("member-info");
      const nameSpan = document.getElementById("member-name");
      const deptSpan = document.getElementById("member-dept");

      if (mockMembers[id]) {
        nameSpan.innerText = mockMembers[id].name;
        deptSpan.innerText = mockMembers[id].dept;
        infoBox.classList.remove("hidden");
      } else {
        alert("找不到此員工編號，請確認後再試一次！");
        infoBox.classList.add("hidden");
      }
    }

    function submitAttendance(status) {
      const name = document.getElementById("member-name").innerText;
      const statusBox = document.getElementById("status-message");
      
      statusBox.classList.remove("hidden");
      if (status === 'Present') {
        statusBox.className = "p-3 rounded-lg text-center font-medium bg-green-100 text-green-700";
        statusBox.innerText = `🎉 ${name} 報名成功！期待當天見面！`;
      } else {
        statusBox.className = "p-3 rounded-lg text-center font-medium bg-gray-100 text-gray-700";
        statusBox.innerText = `👌 已記錄 ${name} 本週不出席。`;
      }
    }
  </script>
</body>
</html>
